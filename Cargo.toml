[package]
name = "modular_synth"
version = "0.2.0"
edition = "2021"
description = "A node-based modular audio synthesizer"
authors = ["Chris"]
license = "MIT"
default-run = "modular_synth"

[dependencies]
eframe = { version = "0.30", features = ["persistence"] }
egui = "0.30"
egui_node_graph2 = { git = "https://github.com/chrischaps/egui_node_graph2" }
cpal = "0.18"
midir = "0.11"
rtrb = "0.3"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5.1"
dirs = "6"
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
