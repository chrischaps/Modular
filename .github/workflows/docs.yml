name: Deploy Docs

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      # The app in the browser, published beside the manual at /modular/play/
      - 'src/**'
      - 'patches/**'
      - 'assets/**'
      - 'index.html'
      - 'Trunk.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Modular
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/

      - name: Build docs
        run: mdbook build docs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # trunk fetches wasm-bindgen and wasm-opt itself
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/

      - name: Build the app for the browser
        run: trunk build --release

      - name: Checkout docs site repo
        uses: actions/checkout@v4
        with:
          repository: chrischaps/docs.chaps.dev
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: docs-site

      - name: Copy built docs
        run: |
          rm -rf docs-site/modular
          cp -r docs/book docs-site/modular
          cp -r dist docs-site/modular/play

      - name: Push to docs site
        run: |
          cd docs-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Update modular docs"
          git push